<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>KOGG · Online phone remote</title><meta name="theme-color" content="#101725"><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="css/remote.css"></head><body><main>
<header><img src="icons/kogg-symbol-white.svg" width="36" height="36" alt=""><div><b>KOGG Presenter</b><small>Phone remote · online</small></div></header>
<div class="remote-heading"><h1>The next moment.<br>At your fingertips.</h1><span id="remoteConnection" class="connection-badge" data-connected="false">NOT CONNECTED</span></div>

<p id="remoteStatus" role="status" aria-live="polite">Connecting…</p><button id="remoteReconnect" class="reconnect" hidden>Reconnect</button>
<section class="remote-preview" aria-label="Current presentation"><span id="remoteLabel">Your presentation will appear here</span><p id="remoteText"></p><small id="remotePosition"></small></section>
<div class="remote-nav"><button data-command="previous" disabled>← Previous</button><button data-command="next" disabled>Next →</button></div><div class="remote-nav remote-secondary"><button data-command="blank" disabled>Blank screen</button><button data-command="resume" disabled>Resume slides</button></div>
<p class="help">No account needed. Keep the laptop open and both devices online. Controls pause if the connection drops. Every tap waits for the laptop’s confirmation.</p><button id="remoteDisconnect">Disconnect this phone</button>
</main><script src="js/supabase-config.js"></script><script src="js/cloud-transport.js"></script><script src="js/cloud-remote-session.js"></script><script src="js/cloud-remote.js"></script></body></html>

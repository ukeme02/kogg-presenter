<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>KOGG · Phone remote</title><link rel="stylesheet" href="css/remote.css"></head><body><main><header><img src="icons/kogg-symbol-white.svg" width="36" height="36" alt=""><div><b>KOGG Presenter</b><small>Phone remote · online Sync</small></div></header><form id="remoteSignIn"><p>Sign in to connect using this private pairing link.</p><label>Email<input id="remoteEmail" type="email" autocomplete="username" required></label><label>Password<input id="remotePassword" type="password" autocomplete="current-password" required></label><button id="remoteSignInButton" type="submit">Sign in &amp; connect</button></form><button id="remoteReconnect" hidden>Reconnect</button><p id="remoteStatus" role="status">Connecting…</p><section class="remote-preview"><span id="remoteLabel">Waiting for the operator</span><p id="remoteText"></p><small id="remotePosition"></small></section><div class="remote-nav"><button data-command="previous" disabled>← Previous</button><button data-command="next" disabled>Next →</button></div><div class="remote-nav"><button data-command="blank" disabled>Blank screen</button><button data-command="resume" disabled>Resume slides</button></div><p class="help">Both devices need internet. This private link grants presentation control. Stop the online remote from Stream when finished.</p><button id="remoteDisconnect">Disconnect this phone</button></main><script src="js/supabase-config.js"></script><script src="js/sync.js"></script><script src="js/cloud-transport.js"></script><script src="js/cloud-remote.js"></script></body></html>

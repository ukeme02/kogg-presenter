<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOGG Presenter — Output</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/display.css">
</head>
<body>
<div id="screen">
  <div id="slideLabel"></div>
  <div id="slideText"><div id="slideContent"></div></div>
  <div id="strongsCard"></div>
  <div id="countdown">
    <div id="countdownTime">00:00</div>
    <div id="clock"></div>
  </div>
  <div id="logoScreen">
    <img id="logoImg" alt="Church logo" hidden>
    <svg id="logoSvg" viewBox="0 0 160 160" width="120" height="120" aria-hidden="true"><rect x="14" y="18" width="132" height="96" rx="18" fill="none" stroke="currentColor" stroke-width="10"/><path d="M80 114v21m-24 6h48" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/><g transform="translate(33.2 19.1) scale(.72)"><path d="M22 28h19v77H22zm25 38 38-38h23L70 66l38 39H85z" fill="currentColor"/><path d="m47 28 25 16-25 23z" fill="currentColor" opacity=".45"/><path d="m47 72 25 16-25 17z" fill="currentColor" opacity=".65"/></g></svg>
    <div id="logoName">KOGG Presenter</div><div id="logoTagline">Worship without limits.</div>
  </div>
  <div id="blankScreen"></div>
  <div id="lowerThird" class="lt-hidden">
    <div id="ltBox">
      <div id="ltLine1"></div>
      <div id="ltLine2"></div>
    </div>
  </div>
</div>
<div id="notesAlert" hidden><div id="notesAlertTrack"></div></div>
<script src="js/idb.js"></script>
<script src="js/library.js"></script>
<script src="js/relay.js"></script>
<script src="js/stream.js"></script>
<script src="js/display.js"></script>
<script src="js/obs-receiver.js"></script>
</body>
</html>
